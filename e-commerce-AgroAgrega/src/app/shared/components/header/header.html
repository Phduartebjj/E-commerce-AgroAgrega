<header class="site-header">
  <div class="barra-anuncios">
    <p class="barra-anuncios-texto">Entrega para todo Brasil e compra online com entrega rápida</p>
  </div>
  <div class="cabecalho-principal">
    <a class="logo-marca" routerLink="/" aria-label="Ir para a página inicial">
      <img class="logo-icone" src="/assets/images/agroagrega-icon.webp" alt="AgroAgrega ícone" />
      <img class="logo-nome" src="/assets/images/AgroAgrega-logo.svg" alt="AgroAgrega" />
    </a>
    <div class="area-busca">
      <input
        #searchInput
        class="campo-busca"
        type="search"
        placeholder="Busque sementes, ferramentas e agroprodutos"
        aria-label="Buscar produtos"
        (keydown.enter)="buscarProdutos(searchInput.value)"
      />
      <button class="botao-busca" type="button" (click)="buscarProdutos(searchInput.value)">
        Buscar
      </button>
    </div>
    <div class="acoes-header" [class.acoes-header-fixas]="navegacaoFixa()">
      <a class="conta-link" [routerLink]="loggedIn() ? '/account' : '/login'">
        @if (loggedIn()) {
          <span class="icone-perfil">
            <img src="/assets/images/profile.webp" alt="Minha Conta" />
          </span>
        }
        <span class="conta-texto">
          <small class="nome-usuario">{{ name() }}</small>
          @if (loggedIn()) {
            <strong>Minha conta</strong>
          }
        </span>
      </a>

      <a class="icone-carrinho" routerLink="/cart" aria-label="Carrinho de Compras">
        <img src="/assets/images/cart.webp" alt="Carrinho de Compras" />
        @if (totalItens() > 0) {
          <span class="contador-carrinho">
            {{ totalItens() }}
          </span>
        }
      </a>

      <a class="icone-pedidos" routerLink="/orders" aria-label="Pedidos">
        <img src="/assets/images/pedidos.webp" alt="Meus pedidos" />
      
      </a>

    </div>
  </div>
  <nav class="navegar-categorias" aria-label="Categorias de produtos" [class.navegar-categorias-fixa]="navegacaoFixa()">
    <div class="conteudo-do-menu">
      <a class="menu-link" routerLink="/products">
        <span class="menu-icon menu-icon--all" aria-hidden="true">
          <img src="/assets/images/todas-categorias.svg" alt="" />
        </span>
        <span>Todas as Categorias</span>
      </a>
      <a class="menu-link" routerLink="/products" [queryParams]="{ category: 'Agricultura de Precisão' }">
        <span class="menu-icon menu-icon--precision" aria-hidden="true"></span>
        <span>Agricultura de Precisão</span>
      </a>
      <a class="menu-link" routerLink="/products" [queryParams]="{ category: 'Irrigação' }">
        <span class="menu-icon menu-icon--irrigation" aria-hidden="true"></span>
        <span>Irrigação</span>
      </a>
      <a class="menu-link" routerLink="/products" [queryParams]="{ category: 'Pecuária' }">
        <span class="menu-icon menu-icon--livestock" aria-hidden="true"></span>
        <span>Pecuária</span>
      </a>
      <a class="menu-link" routerLink="/products" [queryParams]="{ category: 'Insumos' }">
        <span class="menu-icon menu-icon--inputs" aria-hidden="true"></span>
        <span>Insumos</span>
      </a>
      <a class="menu-link" routerLink="/products" [queryParams]="{ category: 'Ferramentas' }">
        <span class="menu-icon menu-icon--tools" aria-hidden="true"></span>
        <span>Ferramentas</span>
      </a>
      <a class="menu-link menu-link--feature" routerLink="/coupons">
        <span class="menu-icon menu-icon--coupon" aria-hidden="true"></span>
        <span>Cupons</span>
      </a>
      <a class="menu-link menu-link--feature" routerLink="/agro-plus">
        <span class="menu-icon menu-icon--agro-plus" aria-hidden="true"></span>
        <span>Agro+</span>
      </a>
      <a class="menu-link menu-link--offers" routerLink="/products" [queryParams]="{ offers: 'true' }">
        <span class="menu-icon menu-icon--offers" aria-hidden="true"></span>
        <span>Ofertas</span>
      </a>
    </div>
  </nav>
</header>
