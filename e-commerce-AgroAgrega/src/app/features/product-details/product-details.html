<!-- Adicionar header aqui acima -->

<main class="product-details">
  @if (product) {
    <section class="product-gallery">
      <div class="main-image">
        <img [src]="product.images[0]" [alt]="product.title" />
      </div>
    </section>

    <section class="product-info">
      <p class="product-id">ID do produto: {{ id }}</p>

      <span class="product-category">
        {{ product.category }}
      </span>

      <h1>{{ product.title }}</h1>

      <p class="product-price">
        {{ product.price | precoFormatado }}
      </p>

      <p class="product-description">
        {{ product.description }}
      </p>

      <div class="product-quantity">
        <span>Quantidade:</span>

        <div class="quantity-control">
          <button type="button" (click)="decreaseQuantity()" [disabled]="quantity === 1">-</button>

          <span>{{ quantity }}</span>

          <button type="button" (click)="increaseQuantity()">+</button>
        </div>
      </div>

      <button type="button" class="add-to-cart" (click)="addToCart()">Adicionar ao carrinho</button>
    </section>
  } @else {
    <div class="error-container">
      <h2>Produto não encontrado</h2>
      <p>O produto com ID {{ id }} não existe.</p>
      <a href="/products">Voltar para produtos</a>
    </div>
  }
  <a routerLink="/cart">link to cart </a>
</main>
