<div class="login-page">
  <div class="login-card">
    <div class="brand">
      <span class="brand-icon">🌱</span>
      <h1>Agro<span>Agrega</span></h1>
    </div>
    <p class="subtitle">Painel Administrativo</p>

    <form (ngSubmit)="onSubmit()">
      <div class="campo">
        <label for="usuario">Usuário</label>
        <input id="usuario" type="text" name="usuario" [(ngModel)]="usuario" required autofocus />
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input id="senha" type="password" name="senha" [(ngModel)]="senha" required />
      </div>

      @if (erro) {
        <p class="erro">Usuário ou senha inválidos.</p>
      }

      <button type="submit">Entrar</button>
    </form>
  </div>
</div>
