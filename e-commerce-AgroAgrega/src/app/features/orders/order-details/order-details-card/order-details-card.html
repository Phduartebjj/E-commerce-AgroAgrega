<h4>Produto</h4>
<div class="product-row">
  <div class="product-image">
    @if (!imageUnavailable) {
      <img
        [src]="item().imgSrc"
        alt="Produto comprado"
        loading="lazy"
        decoding="async"
        width="96"
        height="96"
        (error)="handleImageError()"
      />
    } @else {
      <div class="image-fallback" role="img" aria-label="Imagem do produto indisponível">
        <strong>AgroAgrega</strong>
        <span>Imagem indisponível</span>
      </div>
    }
  </div>
  <div class="product-info">
    <h3>{{ item().name }}</h3>
  </div>
  <span class="quantity">Qtd: {{ item().quantity }}</span>
  <strong class="product-price">R$ {{ item().price | precoFormatado }}</strong>
</div>
