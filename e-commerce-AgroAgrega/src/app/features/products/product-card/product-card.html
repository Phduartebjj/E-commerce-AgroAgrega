<article class="product-card">
  <div class="product-card-top">
    <span class="product-card-tag">12% OFF</span>
  </div>

  <div class="product-card-visual">
    <a [routerLink]="['/products', product().id]">
      <img class="product-card-figure" [src]="product().images[0]" [alt]="product().title" />
    </a>
  </div>

  <div class="product-card-content">
    <p class="product-card-category">{{ product().category | uppercase }}</p>
    <a [routerLink]="['/products', product().id]">
      <h2 class="product-card-title">{{ product().title }}</h2>
    </a>

    <div class="product-card-rating" aria-label="Avaliação do produto">
      <span class="star">
        @for (filled of getStars(product().rating); track $index) {
          {{ filled ? '★' : '☆' }}
        }
      </span>
      <span class="review">{{ product().rating }}</span>
    </div>

    <div class="product-card-price">
      <div class="product-card-amount">
        <strong>{{ product().price | precoFormatado }}</strong>
      </div>
    </div>

    <small class="product-card-installment">ou em até 10x sem juros</small>

    <button
      class="product-card-button"
      [class.product-added]="adicionado()"
      type="button"
      (click)="adicionarAoCarrinho()"
    >
      @if (adicionado()) {
        Adicionado ✓
      } @else {
        Adicionar
      }
    </button>
  </div>
</article>
