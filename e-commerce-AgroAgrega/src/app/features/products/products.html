<section class="product-page">
  <div class="catalog-shell">
    <div class="catalog-layout">
      <aside class="filters-card" aria-label="Filtros de produtos">
        <div class="filters-header">
          <h2>Filtrar produtos</h2>
          <button type="button" class="clear-filters">Limpar</button>
        </div>

        <div class="filters-section">
          <div class="filters-section-title">
            <span>Ordenar por</span>
          </div>

          <label class="rating-option">
            <input type="radio" name="sort" />
            <span>Maior preço</span>
          </label>
          <label class="rating-option">
            <input type="radio" name="sort" />
            <span>Menor preço</span>
          </label>
          <label class="rating-option">
            <input type="radio" name="sort" />
            <span>Relevantes</span>
          </label>
        </div>

        <div class="filters-section">
          <div class="filters-section-title">
            <span>Categorias</span>
          </div>

          <label class="filter-option">
            <input type="checkbox" />
            <span>Agricultura de Precisão</span>
            <strong>4</strong>
          </label>
          <label class="filter-option">
            <input type="checkbox" />
            <span>Irrigação</span>
            <strong>7</strong>
          </label>
          <label class="filter-option">
            <input type="checkbox" />
            <span>Pecuária</span>
            <strong>10</strong>
          </label>
          <label class="filter-option">
            <input type="checkbox" />
            <span>Ferramentas</span>
            <strong>13</strong>
          </label>
          <label class="filter-option">
            <input type="checkbox" />
            <span>Insumos</span>
            <strong>16</strong>
          </label>
        </div>

        <div class="filters-section">
          <div class="filters-section-title">
            <span>Avaliação</span>
          </div>

          <label class="rating-option">
            <input type="radio" name="rating" />
            <span class="stars">★★★★★</span>
            <span>ou mais</span>
          </label>
          <label class="rating-option">
            <input type="radio" name="rating" />
            <span class="stars">★★★★☆</span>
            <span>ou mais</span>
          </label>
        </div>

      </aside>

      <div class="catalog-content">
        @if (filteredProducts().length > 0) {
          <header class="catalog-header">
            <h1>{{ catalogTitle() }}</h1>
          </header>
        }

        <div class="catalog-grid">
          @for (product of filteredProducts(); track product.id) {
            <app-product-card
              (addToCart)="addProductToCart($event)"
              [product]="product"
            ></app-product-card>
          } @empty {
            <div class="empty-products">
              <h2>Ops! Parece que este produto não está disponível ainda.</h2>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
